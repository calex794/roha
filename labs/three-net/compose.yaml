name: akula-three-net
x-base: &base
  image: akula-three-net:local
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  healthcheck:
    test: ["CMD", "/app/lab", "id"]
    interval: 2s
    timeout: 2s
    retries: 30
services:
  peer01:
    <<: *base
    networks: [alpha]
    volumes: [peer01-data:/state]
  peer02:
    <<: *base
    networks: [alpha]
    volumes: [peer02-data:/state]
  peer03:
    <<: *base
    networks: [alpha]
    volumes: [peer03-data:/state]
  peer04:
    <<: *base
    networks: [beta]
    volumes: [peer04-data:/state]
  peer05:
    <<: *base
    networks: [beta]
    volumes: [peer05-data:/state]
  peer06:
    <<: *base
    networks: [beta]
    volumes: [peer06-data:/state]
  peer07:
    <<: *base
    networks: [beta]
    volumes: [peer07-data:/state]
  peer08:
    <<: *base
    networks: [gamma]
    volumes: [peer08-data:/state]
  peer09:
    <<: *base
    networks: [gamma]
    volumes: [peer09-data:/state]
  peer10:
    <<: *base
    networks: [gamma]
    volumes: [peer10-data:/state]
  gateab:
    <<: *base
    networks: [alpha, beta]
    volumes: [gateab-data:/state]
  gatebc:
    <<: *base
    networks: [beta, gamma]
    volumes: [gatebc-data:/state]
networks:
  alpha: {internal: true}
  beta: {internal: true}
  gamma: {internal: true}
volumes:
  peer01-data:
  peer02-data:
  peer03-data:
  peer04-data:
  peer05-data:
  peer06-data:
  peer07-data:
  peer08-data:
  peer09-data:
  peer10-data:
  gateab-data:
  gatebc-data:
