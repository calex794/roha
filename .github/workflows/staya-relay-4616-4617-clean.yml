name: STAYA clean Roha relay 4616 4617 release checks
on:
  push:
    branches:
      - lab/staya-relay-4616-4617-clean-20261019
  workflow_dispatch:
permissions:
  contents: read

jobs:
  relay-core:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.91.0'
      - name: Require our noq 1.4.0 crates from Git
        run: |
          set -euo pipefail
          cargo +1.91.0 fetch --locked
          python3 - <<'PY'
          import tomllib
          with open('Cargo.lock', 'rb') as f:
              packages = tomllib.load(f)['package']
          for n in ('noq', 'noq-proto', 'noq-udp'):
              found = [p for p in packages if p['name'] == n]
              assert len(found) == 1, (n, found)
              p = found[0]
              assert p['version'] == '1.4.0', (n, p)
              assert p.get('source', '').startswith('git+https://github.com/calex794/noq.git'), (n, p)
              print(n, p['source'])
          PY
      - name: Compile Iroh with both changes without unrelated custom path experiments
        run: cargo +1.91.0 check --locked -p iroh
      - name: Verify relay URL path prefix PR 4617
        run: cargo +1.91.0 test --locked -p iroh-relay --lib relay_route_keeps_path_prefix -- --nocapture
      - name: Home relay is removed and can be restored PR 4616
        run: cargo +1.91.0 test --locked -p iroh --features unstable-custom-transports,test-utils --lib endpoint_releases_removed_home_relay -- --nocapture
      - name: Demoted home relay closes its live connection PR 4616
        run: cargo +1.91.0 test --locked -p iroh --features unstable-custom-transports,test-utils --lib test_staya_demoted_home_relay_connection_closes_after_idle -- --nocapture
      - name: Idle relay closes correctly
        run: cargo +1.91.0 test --locked -p iroh --features unstable-custom-transports,test-utils --lib test_active_relay_inactive -- --nocapture
      - name: Replacement relay carries traffic
        run: cargo +1.91.0 test --locked -p iroh --features unstable-custom-transports,test-utils --lib endpoint_relay_map_change -- --nocapture

  relay-library:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.91.0'
      - name: All iroh-relay library unit tests
        run: cargo +1.91.0 test --locked -p iroh-relay --lib -- --nocapture

  iroh-library:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: '1.91.0'
      - name: Iroh library regressions without lab-only custom path tests
        run: timeout 900s cargo +1.91.0 test --locked -p iroh --features unstable-custom-transports,test-utils --lib -- --test-threads=2
