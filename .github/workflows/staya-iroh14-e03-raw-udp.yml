name: Staya Roha E03 raw UDP NAT isolation

on:
  pull_request:
    paths:
      - "iroh/tests/patchbay.rs"
      - "iroh/tests/patchbay/raw_udp_nat.rs"
      - ".github/workflows/staya-iroh14-e03-raw-udp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staya-roha-e03-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  two-reflectors-without-quic:
    name: E03 real Linux netfilter with two plain UDP reflectors
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: "info"
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust stable with rustfmt
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Verify Iroh production transport unchanged and formatting
        run: |
          git merge-base --is-ancestor 55908a5809b61c72ec8deeff024038f4a9d68ab7 HEAD
          git diff --exit-code 55908a5809b61c72ec8deeff024038f4a9d68ab7 HEAD -- Cargo.lock iroh/src
          cargo fmt --all -- --check
      - name: Install isolated NAT tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y conntrack
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true
      - name: Execute baseline replug and targeted-delete with no Iroh or Noq
        shell: bash
        run: |
          set +e
          set -uo pipefail
          failed=0
          : > "${RUNNER_TEMP}/e03-summary.txt"
          for scenario in \
            sty_e03_raw_udp_baseline_no_replug \
            sty_e03_raw_udp_replug_stale_state \
            sty_e03_raw_udp_replug_targeted_delete \
            sty_e03b_raw_udp_burst_stale \
            sty_e03b_raw_udp_burst_targeted_delete \
            sty_e03c_raw_udp_only_old_peer_sequential \
            sty_e03c_raw_udp_only_old_peer_burst; do
            echo "::group::${scenario}"
            log="${RUNNER_TEMP}/${scenario}.log"
            cargo test --locked -p iroh --test patchbay "raw_udp_nat::${scenario}" -- --exact --nocapture --test-threads=1 > "${log}" 2>&1
            code=$?
            cat "${log}"
            echo "::endgroup::"
            report=0
            if grep -q 'STY_E03_MAPPING_COMPARISON' "${log}" &&
               grep -q 'STY_E03_INBOUND_PROBE_RESULTS' "${log}" &&
               grep -q 'test result: ok. 1 passed' "${log}" &&
               [ "${code}" -eq 0 ]; then
              report=1
            fi
            printf '%s exit=%s evidence_complete=%s\n' "${scenario}" "${code}" "${report}" | tee -a "${RUNNER_TEMP}/e03-summary.txt"
            if [ "${report}" -ne 1 ]; then failed=1; fi
          done
          exit "${failed}"
      - name: Preserve evidence including unexpected outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staya-roha-e03-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sty_e03_raw_udp_*.log
            ${{ runner.temp }}/e03-summary.txt
          retention-days: 7
          if-no-files-found: ignore
