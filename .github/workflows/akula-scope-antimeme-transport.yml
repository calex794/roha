name: Akula scoped anti-meme direct Roha transport laboratory
on:
  pull_request:
    paths:
      - 'iroh/examples/akula_scope_antimeme_transport_lab.rs'
      - 'iroh/examples/akula_scope_antimeme_transport_lab/**'
      - 'labs/akula-antimeme-transport/**'
      - '.github/workflows/akula-scope-antimeme-transport.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roha-akula-antimeme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  direct-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
      - name: Run three independent Iroh endpoint transport tests
        run: cargo test --locked -p iroh --example akula_scope_antimeme_transport_lab -- --nocapture
      - name: Checkout exact Akula signed-gate PR code (isolated)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Lalalalendia/Akula
          ref: ed0291f8db71b9072e547b2aee0f85d5d39125c1
          path: akula
          persist-credentials: false
      - name: Build only Akula's opt-in scope policy subprocess
        run: cargo build --locked --manifest-path akula/aquilum-app/Cargo.toml -p aquilum-core --features node-scope-revocation-lab --bin akula-node-policy-lab
      - name: Assert QUIC acknowledgment follows real Akula SQLite admission
        env:
          AKULA_POLICY_LAB_BIN: ${{ github.workspace }}/akula/aquilum-app/target/debug/akula-node-policy-lab
        run: |
          test -x "$AKULA_POLICY_LAB_BIN"
          cargo test --locked -p iroh --example akula_scope_antimeme_transport_lab -- cross_repo::roha_quic_ack_only_after_real_akula_sqlite_acceptance --exact --ignored --nocapture
