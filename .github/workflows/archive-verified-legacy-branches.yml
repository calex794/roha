# Historical phase 1 archived 16 verified refs (run 39701032101).
# Phase 2 archived four more refs (run 39773821288).
# Phase 3 archived the paired-workflow sibling (run 39780847085).
# Phase 4 retires the TLS-parallel sibling after preserving all relay scenarios.
# All obsolete refs are retained by immutable archive tags before deletion.
# Manual reruns are idempotent; a missing ref is not an error.
name: Archive verified legacy branches
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/archive-verified-legacy-branches.yml
      - .github/scripts/archive-orphan.sh
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verified-legacy-archive-${{ github.repository }}
  cancel-in-progress: false
jobs:
  archive:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: false
      - name: Verify merged or ancestor provenance then tag and retire branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          failures=0
          processed=0
          archive_one() {
            local kind="$1" branch="$2" expected="$3" witness="$4"
            local current proof keeper_sha comparison
            # Matching-refs yields [] for an absent branch; unlike single-ref
            # lookup, errors are never turned into an unsafe "already absent".
            local ref_json
            if ! ref_json="$(gh api "repos/${REPO}/git/matching-refs/heads/${branch}")"; then
              echo "::error::Cannot verify branch ref for $branch"
              return 1
            fi
            if ! current="$(jq -r --arg exact "refs/heads/${branch}" '
              if type != "array" then error("not a ref array")
              else
                [.[] | select(.ref == $exact) | .object.sha] |
                if length == 0 then ""
                elif length == 1 and
                     (.[0] | type) == "string" and
                     (.[0] | test("^[0-9a-f]{40}$"))
                then .[0]
                else error("invalid or ambiguous branch ref")
                end
              end
            ' <<< "$ref_json")"; then
              echo "::error::Invalid branch ref response for $branch"
              return 1
            fi
            if [[ -z "$current" ]]; then echo "Already absent: $branch"; return 0; fi
            if [[ "$current" != "$expected" ]]; then
              echo "::warning::Ref moved since audit: $branch, refusing archival"
              return 1
            fi
            if [[ "$kind" == "merged" ]]; then
              if ! proof="$(gh api "repos/${REPO}/pulls/${witness}")"; then return 1; fi
              if ! jq -e --arg branch "$branch" --arg sha "$expected" --arg repo "$REPO" '
                .merged_at != null and .base.ref == "main" and
                .head.ref == $branch and .head.sha == $sha and
                .head.repo.full_name == $repo
              ' <<< "$proof" >/dev/null; then
                echo "::error::Merge provenance no longer matches: $branch / PR $witness"
                return 1
              fi
            elif [[ "$kind" == "ancestor" ]]; then
              keeper_sha="$(gh api "repos/${REPO}/git/ref/heads/${witness}" --jq '.object.sha' 2>/dev/null || true)"
              if [[ -z "$keeper_sha" ]]; then echo "::error::Keeper ref unavailable: $witness"; return 1; fi
              if ! comparison="$(gh api "repos/${REPO}/compare/${expected}...${keeper_sha}")"; then return 1; fi
              if ! jq -e '(.behind_by == 0) and (.status == "ahead" or .status == "identical")' <<< "$comparison" >/dev/null; then
                echo "::error::Branch is no longer contained in keeper: $branch -> $witness"
                return 1
              fi
            else
              echo "::error::Invalid archival proof type $kind"
              return 1
            fi
            # archive_one is invoked in an if-condition. Bash disables errexit
            # inside such functions, so propagate archive failures explicitly.
            TARGET_BRANCH="$branch" EXPECTED_SHA="$expected" MODE="ARCHIVE" CONFIRMATION="ARCHIVE" \
              bash .github/scripts/archive-orphan.sh || return 1
            echo "Archived $branch with proof $kind / $witness"
          }
          while IFS='|' read -r kind branch expected witness; do
            [[ -n "$kind" ]] || continue
            if archive_one "$kind" "$branch" "$expected" "$witness"; then
              processed=$((processed + 1))
            else
              failures=$((failures + 1))
            fi
          done <<'VERIFIED_BRANCHES'
          ancestor|lab/staya-relay-tls-parallel-20261019|30e732746a3ccc110010da01227800dbb0013100|lab/staya-relay-backend-restart-20261019
          VERIFIED_BRANCHES
          echo "Verified entries: $processed; failures: $failures" >> "$GITHUB_STEP_SUMMARY"
          if (( failures > 0 )); then exit 1; fi
