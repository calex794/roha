name: Akula dependency security smoke

on:
  pull_request:
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - .github/workflows/akula-dependency-smoke.yml
  push:
    branches:
      - main
      - "fix/rustsec-*"
    paths:
      - Cargo.lock
      - Cargo.toml
      - "**/Cargo.toml"
      - .github/workflows/akula-dependency-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-dependency-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-security:
    name: Linux security and library checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout the exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.0"

      - name: Verify patched certificate packages are locked
        shell: bash
        run: |
          python3 - <<'PY'
          import tomllib
          with open("Cargo.lock", "rb") as f:
              packages = tomllib.load(f)["package"]
          minimum = {
              "rustls-webpki": (0, 103, 16),
              "webpki-root-certs": (1, 0, 10),
              "webpki-roots": (1, 0, 10),
          }
          for name, required in minimum.items():
              found = [
                  p for p in packages
                  if p["name"] == name and p.get("source", "").startswith("registry+")
              ]
              assert found, f"Missing registry package: {name}"
              versions = [tuple(map(int, p["version"].split(".")[:3])) for p in found]
              assert all(version >= required for version in versions), (name, versions, required)
              print(f"{name}: {versions} >= {required}")
          PY

      - name: Check Iroh, relay and DNS using locked dependencies
        run: cargo +1.91.0 check --locked -p iroh -p iroh-relay -p iroh-dns-server

      - name: Test relay library
        run: cargo +1.91.0 test --locked -p iroh-relay --lib -- --test-threads=2

      - name: Security and license audit
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --workspace --all-features
          command: check
          command-arguments: "-Dwarnings"
