name: STAYA dependency advisory resolution dry run
on:
  push:
    branches:
      - fix/staya-iroh-source-ip-relay-prefix-20261027
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate-verified-lock-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.0"
      - name: Resolve both RustSec advisories through Cargo registry, without editing remote branch
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.91.0 update -p ctutils --precise 0.4.4
          cargo +1.91.0 update -p tokio --precise 1.53.3
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          pkgs = {p["name"]:p for p in tomllib.loads(Path("Cargo.lock").read_text())["package"]}
          for name,version in (("ctutils","0.4.4"),("tokio","1.53.3"),("noq","1.3.0"),("rustls-webpki","0.103.16")):
              assert pkgs[name]["version"] == version, (name, pkgs[name]["version"])
          PY
          echo 'STAYA_CARGO_LOCK_DIFF_BEGIN'
          git diff -- Cargo.lock
          echo 'STAYA_CARGO_LOCK_DIFF_END'
          test -n "$(git diff -- Cargo.lock)"
          git diff --exit-code -- Cargo.toml iroh/Cargo.toml iroh-base/Cargo.toml
      - name: Verify modified Cargo.lock actually resolves and compiles
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.91.0 metadata --locked --format-version 1 --no-deps > /dev/null
          cargo +1.91.0 check --locked -p iroh -p iroh-relay
          echo STAYA_DEPENDENCY_RESOLUTION_AND_CHECK_OK
