name: Akula Roha three-network store-and-forward lab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "iroh/examples/akula_three_net_lab.rs"
      - "labs/three-net/**"
      - ".github/workflows/akula-three-net-lab.yml"
permissions:
  contents: read
jobs:
  three-net:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check Rust and Python
        run: |
          python3 -m py_compile labs/three-net/run.py
          cargo check --locked -p iroh --example akula_three_net_lab
      - name: Run twelve independent QUIC nodes in three networks
        run: python3 labs/three-net/run.py --output labs/three-net/report.json
      - name: Save results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: akula-three-net-report
          path: labs/three-net/report.json
          if-no-files-found: warn
