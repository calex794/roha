name: STAYA Iroh part 11 full branch history
on:
  push:
    branches:
      - lab/staya-iroh-fork-census-20261019
    paths:
      - .github/workflows/staya-iroh-part11-history.yml
permissions:
  contents: write
concurrency:
  group: staya-iroh-part11-full-audit
  cancel-in-progress: false
jobs:
  part11:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate frozen corpus
        run: |
          python3 -m py_compile tools/staya/iroh_part_history_audit.py
          python3 tools/staya/iroh_part_history_audit.py --part 11 --dry-run
      - name: Review 104 Iroh candidate branch heads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/staya/iroh_part_history_audit.py --part 11 --workers 3
      - name: Commit evidence
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/staya/iroh-fork-census/2026-10-18/part_review/part_11_*
          if ! git diff --cached --quiet; then
            git commit -m 'data(staya): part 11 branch history evidence'
            git push origin HEAD:lab/staya-iroh-fork-census-20261019
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staya-iroh-part11-history
          path: docs/staya/iroh-fork-census/2026-10-18/part_review/part_11_*
          if-no-files-found: warn
