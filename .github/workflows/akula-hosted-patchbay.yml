name: Akula hosted P2P path regression

on:
  pull_request:
    paths:
      - "iroh/**"
      - "Cargo.lock"
      - ".github/workflows/akula-hosted-patchbay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-hosted-path-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-path-regression:
    name: P2P direct, NAT and route recovery (hosted Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      RUST_BACKTRACE: "1"
      IROH_FORCE_STAGING_RELAYS: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.0"

      - name: Install pinned nextest
        uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: nextest@0.9.80

      - name: Permit Linux user namespace creation for Patchbay
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sysctl kernel.unprivileged_userns_clone || true

      - name: Run four isolated live-path regression tests
        run: |
          cargo +1.91.0 nextest run --locked \
            -p iroh --features iroh/qlog --test patchbay --profile patchbay \
            -E 'test(holepunch_simple) | test(lan_switch_advertises_new_addr_without_relay) | test(link_outage_recovery_client) | test(link_outage_recovery_server)' \
            --status-level pass

      - name: Ensure Cargo.lock was not rewritten
        run: git diff --exit-code -- Cargo.lock
