name: STAYA Iroh part 08 full branch history
on:
  push:
    branches:
      - lab/staya-iroh-fork-census-20261019
    paths:
      - .github/workflows/staya-iroh-part08-history.yml
permissions:
  contents: write
concurrency:
  group: staya-iroh-part08-full-audit
  cancel-in-progress: false
jobs:
  part08:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify frozen corpus
        run: |
          python3 -m py_compile tools/staya/iroh_part_history_audit.py
          python3 tools/staya/iroh_part_history_audit.py --part 8 --dry-run
      - name: Examine 104 fork heads of part 08
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python3 tools/staya/iroh_part_history_audit.py --part 8 --workers 3
      - name: Save history evidence in research branch
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/staya/iroh-fork-census/2026-10-18/part_review/part_08_*
          if ! git diff --cached --quiet; then
            git commit -m 'data(staya): part 08 evidence for 104 fork heads'
            git push origin HEAD:lab/staya-iroh-fork-census-20261019
          fi
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staya-iroh-part08-history
          path: docs/staya/iroh-fork-census/2026-10-18/part_review/part_08_*
          if-no-files-found: warn
