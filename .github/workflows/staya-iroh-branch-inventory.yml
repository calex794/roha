name: Staya Iroh non-default branch inventory
on:
  push:
    branches:
      - lab/staya-iroh-fork-census-20261019
    paths:
      - .github/workflows/staya-iroh-branch-inventory.yml
      - tools/staya/iroh_branch_inventory.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staya-iroh-branch-inventory
  cancel-in-progress: false
jobs:
  branches:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Verify stage-one data
        run: test -s docs/staya/iroh-fork-census/2026-10-18/all_forks.json
      - name: Enumerate all branch names in accessible fork network
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: python3 tools/staya/iroh_branch_inventory.py
      - name: Persist branch inventory to isolated laboratory branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/staya/iroh-fork-census/2026-10-18
          if ! git diff --cached --quiet; then
            git commit -m "data(staya): capture all listed Iroh fork branch names"
            git push origin HEAD:lab/staya-iroh-fork-census-20261019
          fi
      - name: Export raw inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02b
        with:
          name: staya-iroh-branches
          path: docs/staya/iroh-fork-census/2026-10-18
          if-no-files-found: warn
