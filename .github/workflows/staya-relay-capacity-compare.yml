name: Staya comparable local relay throughput

on:
  push:
    branches:
      - "repro/iroh-4603-speed-control-20261018"
      - "integration/iroh-4599-4603-compat-20261018"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Print baseline identity
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Identical local-channel measurement, 3 repetitions
        env:
          RUST_TEST_THREADS: "1"
        run: |
          set -eu
          for run in 1 2 3; do
            echo "=== STAYA_COMPARE run=${run} ==="
            STAYA_BUILD_KIND="${GITHUB_REF_NAME}" cargo test --locked -p iroh --lib relay_two_healthy_capacity_reference -- --nocapture
          done
