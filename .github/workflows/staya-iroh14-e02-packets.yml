name: Staya Roha E02 packet trace

on:
  pull_request:
    paths:
      - "iroh/tests/patchbay/relay.rs"
      - ".github/workflows/staya-iroh14-e02-packets.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staya-roha-e02-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  virtual-nat-packet-proof:
    name: E02 nft trace + conntrack events + tcpdump in isolated router
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: "info,iroh::socket=debug"
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust stable and rustfmt
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Check upstream baseline and product source untouched
        run: |
          git merge-base --is-ancestor 55908a5809b61c72ec8deeff024038f4a9d68ab7 HEAD
          git diff --exit-code 55908a5809b61c72ec8deeff024038f4a9d68ab7 HEAD -- Cargo.lock iroh/src
          cargo fmt --all -- --check
      - name: Install passive trace tools for isolated namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y conntrack tcpdump nftables
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true
      - name: Compare negative and targeted-positive packet journeys
        shell: bash
        run: |
          set +e
          set -uo pipefail
          failed=0
          : > "${RUNNER_TEMP}/e02-results.txt"
          for spec in \
            "sty_nat_restore_same_connection_local_network_hint_only:RED" \
            "sty_nat_restore_same_connection_targeted_old_peer_flow:PASS"; do
            scenario=${spec%:*}
            expected=${spec#*:}
            log="${RUNNER_TEMP}/e02-${scenario}.log"
            echo "::group::${scenario} trace (expected ${expected})"
            STY_E02_PACKET_TRACE=1 cargo test --locked -p iroh --test patchbay "relay::${scenario}" -- --exact --nocapture --test-threads=1 > "${log}" 2>&1
            code=$?
            cat "${log}"
            valid=0
            if grep -q 'STY_E02_PACKET_TRACE_DONE' "${log}"; then
              if [ "${expected}" = PASS ]; then
                if [ "${code}" -eq 0 ] &&
                   grep -q 'test result: ok. 1 passed' "${log}" &&
                   grep -q 'STY_PATH_DIRECT_RECOVERED' "${log}"; then valid=1; fi
              else
                if [ "${code}" -eq 101 ] &&
                   grep -q 'test result: FAILED. 0 passed; 1 failed' "${log}" &&
                   grep -q 'STY_PATH_RELAY_SELECTED' "${log}" &&
                   ! grep -q 'STY_PATH_DIRECT_RECOVERED' "${log}"; then valid=1; fi
              fi
            fi
            echo "::endgroup::"
            printf '%s expected=%s exit=%s accepted=%s\n' "${scenario}" "${expected}" "${code}" "${valid}" | tee -a "${RUNNER_TEMP}/e02-results.txt"
            if [ "${valid}" -ne 1 ]; then failed=1; fi
          done
          exit "${failed}"
      - name: Preserve original packet traces and test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staya-roha-e02-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/staya-e02-*/*
            ${{ runner.temp }}/e02-*.log
            ${{ runner.temp }}/e02-results.txt
          if-no-files-found: ignore
          retention-days: 7
