name: Staya P2P Path Smoke

on:
  pull_request:
    paths:
      - "iroh/tests/patchbay/relay.rs"
      - ".github/workflows/staya-path-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staya-path-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  direct-relay-direct:
    name: Hosted direct-relay-direct check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: "1"
      RUST_LOG: "info"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: stable

      - name: Check unprivileged network namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user true

      - name: Run only the two new Patchbay cases
        run: |
          set -o pipefail
          cargo test --locked -p iroh --test patchbay direct_relay_direct_ -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/staya-path-smoke.log"

      - name: Check Cargo.lock is unchanged
        run: git diff --exit-code Cargo.lock

      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staya-path-smoke-${{ github.sha }}
          path: |
            ${{ runner.temp }}/staya-path-smoke.log
            target/testdir-current/
          retention-days: 7
          if-no-files-found: ignore
