name: Akula lab baseline (iroh)

on:
  push:
    branches:
      - "lab/**"
      - "repro/**"
      - "fix/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: akula-roha-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Rust 1.91 - check, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Rust 1.91
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
          components: rustfmt
      - name: Show source versions
        run: |
          git rev-parse HEAD
          rustc --version
          cargo --version
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Check iroh without changing lockfile
        run: cargo check --locked -p iroh
      - name: Run iroh library tests
        run: cargo test --locked -p iroh --lib -- --test-threads=4

# Patchbay needs Linux user namespaces and is kept in a separate laboratory job.
# Passing this workflow never implies that simulated NAT/relay tests have passed.
