name: Roha ten-peer messenger laboratory

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "iroh/examples/akula_chat_lab.rs"
      - "labs/ten-peer/**"
      - ".github/workflows/akula-ten-peer-lab.yml"

permissions:
  contents: read

concurrency:
  group: roha-ten-peer-lab
  cancel-in-progress: true

jobs:
  ten-peers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Inspect environment
        run: |
          docker --version
          docker compose version
          python3 -m py_compile labs/ten-peer/run.py
      - name: Build and run ten real containers
        run: python3 labs/ten-peer/run.py --output labs/ten-peer/report.json
      - name: Archive lab report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roha-ten-peer-lab
          path: labs/ten-peer/report.json
          retention-days: 14
          if-no-files-found: warn
