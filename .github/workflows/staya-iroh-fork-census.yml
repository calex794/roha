name: Staya Iroh fork census
on:
  push:
    branches:
      - lab/staya-iroh-fork-census-20261019
    paths:
      - .github/workflows/staya-iroh-fork-census.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: staya-iroh-fork-census
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout isolated lab branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Enumerate official Iroh forks and rank own changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python3 tools/staya/iroh_fork_census.py
      - name: Publish machine-readable census to the lab branch
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/staya/iroh-fork-census
          if ! git diff --cached --quiet; then
            git commit -m "data(staya): record official Iroh fork census"
            git push origin HEAD:lab/staya-iroh-fork-census-20261019
          fi
      - name: Publish report as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02b
        with:
          name: staya-iroh-forks
          path: docs/staya/iroh-fork-census
          if-no-files-found: warn
