name: STAYA Iroh network fixes portable acceptance
on:
  push:
    branches:
      - fix/staya-iroh-source-ip-relay-prefix-20261027
  workflow_dispatch:
permissions:
  contents: read

jobs:
  network-portability:
    name: Source IP and RelayUrl on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.0"
      - name: Assert base dependencies and exact source contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          p={item["name"]:item for item in tomllib.loads(Path("Cargo.lock").read_text())["package"]}
          assert p["noq"]["version"] == "1.3.0", "Keep existing Roha version rather than import lab's noq 1.4.0"
          assert p["rustls-webpki"]["version"] == "0.103.16"
          assert "tracing" in p["iroh-base"]["dependencies"]
          s=Path("iroh/src/socket/remote_map/remote_state.rs").read_text()
          assert "smallvec![selected.clone(), unpinned]" in s
          assert "initial_on_selected_path_leaves_from_its_local_ip" in s
          r=Path("iroh-base/src/relay_url.rs").read_text()
          assert '#[serde(from = "Url")]' in r
          assert "test_relay_url_deserialize_trailing_slash" in r
          PY
      - name: QUIC Initial source-address, IPv6 fallback, and relay dedup tests
        shell: bash
        run: cargo +1.91.0 test --locked -p iroh --lib socket::remote_map::remote_state -- --nocapture
      - name: Explicit IPv6 fallback on this OS
        shell: bash
        run: cargo +1.91.0 test --locked -p iroh --lib initial_on_selected_ipv6_path_arrives_when_its_local_ip_is_gone -- --nocapture
      - name: Relay URL parsing, serialization and normalization
        shell: bash
        run: cargo +1.91.0 test --locked -p iroh-base --features relay test_relay_url_ -- --nocapture
      - name: Prefix routing compatibility
        shell: bash
        run: cargo +1.91.0 test --locked -p iroh-relay --lib relay_route_keeps_path_prefix -- --nocapture
      - name: Install local nginx, openssl and curl (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx openssl curl
      - name: nginx/TLS/WebSocket and probe, 16 churn and 8 concurrent clients (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          STAYA_STRESS_ROUNDS: "16"
          STAYA_PARALLEL_CLIENTS: "8"
        run: |
          timeout 600s cargo +1.91.0 test --locked -p iroh-relay --features server,test-utils --test relay_axum relay_prefix_nginx_https_end_to_end -- --ignored --nocapture
