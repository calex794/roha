name: Akula lab iroh 4588 patchbay
on:
  push:
    branches:
      - "repro/**"
      - "fix/**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lan-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.0"
      - name: Check user namespace capabilities
        run: |
          cat /proc/sys/kernel/unprivileged_userns_clone || true
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user --net true
      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest@0.9.80
      - name: Compile and run only #4588 experiment
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: "info"
        run: |
          cargo nextest run --locked -p iroh --test patchbay --profile patchbay -E 'test(lan_switch_advertises_new_addr_without_relay) | test(lan_repeated_switch_without_relay)' --no-fail-fast
      - name: Relay connectivity regression checks
        env:
          RUST_BACKTRACE: "1"
          RUST_LOG: "info"
        run: |
          cargo nextest run --locked -p iroh --test patchbay --profile patchbay -E 'test(relay_connect_ipv4) | test(relay_udp_blocked_both) | test(relay_reconnect_link_outage_client) | test(holepunch_simple)' --no-fail-fast
