name: Akula lab Roha with forked noq
on:
  push:
    branches:
      - "integration/roha-noq-forks-*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.91.0"
      - name: Resolve patched dependencies (isolated experiment)
        run: |
          cargo update -p noq -p noq-proto -p noq-udp
          cargo tree -p iroh -i noq
          cargo tree -p iroh -i noq-proto
          cargo tree -p iroh -i noq-udp
      - name: Check Roha against forked noq
        run: cargo check -p iroh
      - name: Test Roha library
        run: cargo test -p iroh --lib -- --test-threads=4
      - name: Validate source revisions
        run: |
          grep -A6 '^name = "noq"' Cargo.lock
          grep -A6 '^name = "noq-proto"' Cargo.lock
          grep -A6 '^name = "noq-udp"' Cargo.lock
      - name: Upload resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roha-noq-integration-lock
          path: Cargo.lock
          if-no-files-found: error
