name: Akula lab Roha with forked noq
on:
  push:
    branches:
      - "integration/roha-noq-forks-*"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: "1.91.0"
      - name: Resolve patched dependencies (isolated experiment)
        run: |
          cargo update -p noq -p noq-proto -p noq-udp
          cargo tree -p iroh -i noq
          cargo tree -p iroh -i noq-proto
          cargo tree -p iroh -i noq-udp
      - name: Show exact Cargo.lock changes for review
        run: |
          echo AKULA_LOCK_DIFF_START
          git -c color.ui=false --no-pager diff --no-ext-diff -- Cargo.lock
          echo AKULA_LOCK_DIFF_END
      - name: Check Roha against forked noq
        run: cargo check --locked -p iroh
      - name: Test Roha library
        run: cargo test --locked -p iroh --lib -- --test-threads=4
      - name: Validate source revisions
        run: |
          grep -A6 '^name = "noq"' Cargo.lock
          grep -A6 '^name = "noq-proto"' Cargo.lock
          grep -A6 '^name = "noq-udp"' Cargo.lock
      - name: Verify fork source and version in Cargo.lock
        run: |
          python3 -c 'import tomllib; p=tomllib.load(open("Cargo.lock","rb"))["package"]; target="2eabf9895d40c263aa3369afd66efcf4a5d95056"; assert all(len([x for x in p if x["name"]==n and x["version"]=="1.4.0" and target in x.get("source","") and "github.com/calex794/noq" in x.get("source","")])==1 for n in ("noq","noq-proto","noq-udp"))'
      - name: Check user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare --user --map-root-user --net true
      - name: Install nextest
        uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2.85.12
        with:
          tool: nextest@0.9.80
      - name: LAN and relay regression suite
        run: |
          cargo nextest run --locked -p iroh --test patchbay --profile patchbay -E 'test(lan_switch_advertises_new_addr_without_relay) | test(lan_repeated_switch_without_relay) | test(relay_connect_ipv4) | test(relay_udp_blocked_both) | test(relay_reconnect_link_outage_client) | test(holepunch_simple)' --no-fail-fast
      - name: Upload resolved lockfile for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: roha-noq-integration-lock
          path: Cargo.lock
          if-no-files-found: error
